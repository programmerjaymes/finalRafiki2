# Netlify Database: Use unpooled URL for migrations, pooled URL for runtime

[build]
  command = "DATABASE_URL=$NETLIFY_DATABASE_URL_UNPOOLED npx prisma generate && DATABASE_URL=$NETLIFY_DATABASE_URL_UNPOOLED npx prisma migrate deploy && npm run build"
  publish = ".next"
  environment = { DATABASE_URL = "${NETLIFY_DATABASE_URL}" }

[[plugins]]
  package = "@netlify/plugin-nextjs"
